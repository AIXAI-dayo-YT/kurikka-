<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC CLICKER - リアルタイムマルチプレイ対応版</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 登録不要でリアルタイム通信を行うためのMQTTライブラリをCDNから読込 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

    <style>
        /* --- 基本スタイル --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #05050a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .tech-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* --- 左右レイアウト --- */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle, #0f111a 0%, #05050a 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
        }

        .right-panel {
            width: 480px;
            display: flex;
            flex-direction: column;
            background: #090a10;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- 左パネル（ゲームメイン） --- */
        .game-title {
            font-size: 24px;
            letter-spacing: 4px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
            margin-bottom: 10px;
            font-weight: 900;
        }

        /* 協力型イベントプログレスバー */
        .coop-container {
            width: 80%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 25px;
            text-align: center;
        }

        .coop-title {
            font-size: 11px;
            color: #c084fc;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .coop-bar-bg {
            width: 100%;
            height: 8px;
            background: #11131e;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .coop-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #c084fc, #00f2fe);
            box-shadow: 0 0 8px #c084fc;
            transition: width 0.5s ease;
        }

        .coop-stats {
            font-size: 10px;
            color: #64748b;
        }

        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .crystal-count {
            font-size: 40px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            margin-bottom: 4px;
        }

        .cps-count {
            font-size: 15px;
            color: #94a3b8;
        }

        /* クリスタル */
        .crystal-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .crystal {
            width: 160px;
            height: 210px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 40%, #c084fc 100%);
            clip-path: polygon(50% 0%, 85% 25%, 85% 75%, 50% 100%, 15% 75%, 15% 25%);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease, filter 0.1s ease;
            position: relative;
        }

        .crystal::before {
            content: '';
            position: absolute;
            top: 2%; left: 2%; right: 2%; bottom: 2%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 55%, rgba(0,0,0,0.4) 100%);
            clip-path: polygon(50% 0%, 85% 25%, 85% 75%, 50% 100%, 15% 75%, 15% 25%);
        }

        .crystal:hover {
            filter: brightness(1.2) drop-shadow(0 0 20px rgba(0, 242, 254, 0.8));
            transform: scale(1.03);
        }

        .crystal:active {
            transform: scale(0.96);
        }

        .crystal.frenzy-active {
            animation: crystal-frenzy-anim 0.5s infinite alternate;
        }

        @keyframes crystal-frenzy-anim {
            0% { box-shadow: 0 0 30px #ff007f, inset 0 0 10px #ff007f; filter: brightness(1.2) scale(1.02); }
            100% { box-shadow: 0 0 50px #ff007f, inset 0 0 25px #ff007f; filter: brightness(1.4) scale(1.05); }
        }

        .buff-display {
            font-size: 13px;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 20px;
            padding: 4px 14px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .buff-display.active {
            opacity: 1;
        }

        /* 画面左下：オンラインログ */
        .log-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 280px;
            height: 110px;
            background: rgba(9, 10, 16, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .log-title {
            color: #94a3b8;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 2px;
            margin-bottom: 2px;
        }

        .log-item {
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 右パネル（タブ） --- */
        .tab-headers {
            display: flex;
            background: #11131e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-button {
            flex: 1;
            padding: 15px 0;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-align: center;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.02);
            color: #e2e8f0;
        }

        .tab-button.active {
            color: #00f2fe;
            border-bottom: 2px solid #00f2fe;
            background: rgba(0, 242, 254, 0.02);
        }

        .tab-contents {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* --- 施設 ＆ 強化スタイル --- */
        .building-item, .upgrade-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .building-item:hover, .upgrade-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .building-item.disabled, .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.05) !important;
            background: rgba(255, 255, 255, 0.01) !important;
        }

        .building-info, .upgrade-info {
            flex: 1;
        }

        .building-name, .upgrade-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .upgrade-name {
            color: #c084fc;
        }

        .building-desc, .upgrade-desc {
            font-size: 11px;
            color: #64748b;
        }

        .building-cost-box, .upgrade-cost {
            text-align: right;
            padding-left: 10px;
        }

        .building-cost, .upgrade-cost {
            font-size: 14px;
            font-weight: bold;
            color: #00f2fe;
        }

        .upgrade-cost {
            color: #c084fc;
        }

        .building-count {
            font-size: 18px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.25);
        }

        /* --- ランキングスタイル --- */
        .ranking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .status-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .status-badge.online {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-badge.offline {
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 10px 15px;
        }

        .ranking-item.self {
            border-color: rgba(0, 242, 254, 0.4);
            background: rgba(0, 242, 254, 0.03);
        }

        .rank-number {
            width: 25px;
            font-weight: bold;
            font-size: 15px;
            color: #64748b;
        }

        .rank-number.top-rank {
            color: #00f2fe;
        }

        .rank-name {
            flex: 1;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-values {
            text-align: right;
        }

        .rank-crystals {
            font-size: 13px;
            font-weight: bold;
        }

        .rank-cps {
            font-size: 10px;
            color: #64748b;
        }

        /* --- 実績スタイル --- */
        .achievement-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            opacity: 0.35;
        }

        .achievement-item.unlocked {
            opacity: 1;
            background: rgba(0, 242, 254, 0.03);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .achievement-badge {
            width: 32px;
            height: 32px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-right: 12px;
        }

        .achievement-item.unlocked .achievement-badge {
            background: #00f2fe;
            color: #05050a;
        }

        /* --- 管理・統計 --- */
        .stats-list {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .text-input {
            width: 100%;
            padding: 10px;
            background: #11131e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #f43f5e;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            margin-bottom: 10px;
        }

        .btn-action:hover { background: #f43f5e; color: #fff; }

        .btn-save {
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #00f2fe;
        }

        .btn-save:hover { background: #00f2fe; color: #05050a; }

        /* --- 演出・隕石等 --- */
        .meteor {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #ff007f 0%, #7928ca 100%);
            border-radius: 50%;
            box-shadow: 0 0 20px #ff007f;
            cursor: pointer;
            z-index: 100;
            animation: meteor-pulse 1s infinite alternate, meteor-float 12s linear forwards;
        }

        @keyframes meteor-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        @keyframes meteor-float {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        .click-popup {
            position: absolute;
            color: #00f2fe;
            font-weight: 900;
            font-size: 20px;
            pointer-events: none;
            animation: popup-anim 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            text-shadow: 0 0 6px rgba(0, 242, 254, 0.8);
            z-index: 10;
        }

        @keyframes popup-anim {
            0% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) translateY(-100px) scale(0.8); opacity: 0; }
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(9, 10, 16, 0.95);
            border: 1px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            border-radius: 8px;
            padding: 12px 20px;
            color: #fff;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s;
            pointer-events: none;
            width: 300px;
        }

        .notification.show { transform: translateY(0); opacity: 1; }

        .notif-title { color: #ff007f; font-weight: bold; font-size: 13px; margin-bottom: 2px; }

        .notif-msg { font-size: 11px; color: #94a3b8; }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            .left-panel { height: 55vh; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: sticky; top: 0; z-index: 10; }
            .right-panel { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

    <!-- 左パネル -->
    <div class="left-panel">
        <h1 class="game-title tech-font">COSMIC CLICKER</h1>
        
        <!-- 全銀河協力イベント -->
        <div class="coop-container">
            <div class="coop-title tech-font">GALACTIC MISSION: COOP CLICK EVENT</div>
            <div class="coop-bar-bg">
                <div id="coop-bar" class="coop-bar-fill"></div>
            </div>
            <div id="coop-stats" class="coop-stats tech-font">銀河累計クリック: 0 / 1,000,000 (0.00%)</div>
        </div>

        <div class="stats-container">
            <div id="crystals-display" class="crystal-count tech-font">0</div>
            <div id="cps-display" class="cps-count">毎秒: 0 クリスタル</div>
            <div id="buff-timer" class="buff-display tech-font">FRENZY ACTIVE (15s)</div>
        </div>

        <div class="crystal-wrapper">
            <div id="crystal-btn" class="crystal"></div>
        </div>

        <!-- アクティビティログ -->
        <div class="log-panel">
            <div class="log-title tech-font">GALACTIC FEED (ACTIVITY LOG)</div>
            <div id="log-content" style="display:flex; flex-direction:column-reverse; gap:2px; height:100%; overflow:hidden;">
                <!-- ログ内容 -->
            </div>
        </div>
    </div>

    <!-- 右パネル -->
    <div class="right-panel">
        <div class="tab-headers">
            <button class="tab-button active" onclick="switchTab('buildings')">施設</button>
            <button class="tab-button" onclick="switchTab('upgrades')">強化</button>
            <button class="tab-button" onclick="switchTab('ranking')">ランキング</button>
            <button class="tab-button" onclick="switchTab('achievements')">実績</button>
            <button class="tab-button" onclick="switchTab('settings')">管理</button>
        </div>

        <div class="tab-contents">
            <!-- 施設タブ -->
            <div id="tab-buildings" class="tab-pane active">
                <div id="buildings-list"></div>
            </div>

            <!-- 強化タブ -->
            <div id="tab-upgrades" class="tab-pane">
                <div id="upgrades-list"></div>
            </div>

            <!-- ランキングタブ -->
            <div id="tab-ranking" class="tab-pane">
                <div class="ranking-header">
                    <h3 style="font-size: 15px;">銀河採掘ランキング</h3>
                    <span id="connection-status" class="status-badge offline">OFFLINE (LOCAL AI)</span>
                </div>
                <div id="ranking-list" class="ranking-list"></div>
            </div>

            <!-- 実績タブ -->
            <div id="tab-achievements" class="tab-pane">
                <div id="achievements-list"></div>
            </div>

            <!-- 管理タブ -->
            <div id="tab-settings" class="tab-pane">
                <div class="input-group">
                    <label for="username-input">あなたの採掘者ニックネーム</label>
                    <input type="text" id="username-input" class="text-input" maxlength="15" onchange="changeUsername(this.value)">
                </div>

                <h3 style="margin-bottom: 10px; font-size: 14px;">ローカルデータ統計</h3>
                <div class="stats-list">
                    <div class="stats-row">
                        <span class="stats-label">累計採掘クリスタル</span>
                        <span id="stat-total-crystals" class="tech-font">0</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">手動クリック回数</span>
                        <span id="stat-total-clicks" class="tech-font">0</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">手動クリック生産量</span>
                        <span id="stat-click-power" class="tech-font">1</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">回収した宇宙隕石</span>
                        <span id="stat-meteors" class="tech-font">0</span>
                    </div>
                </div>

                <button class="btn-action btn-save" onclick="saveGame(true)">手動セーブ</button>
                <button class="btn-action" onclick="resetGame()">データ消去（リセット）</button>
            </div>
        </div>
    </div>

    <!-- 通知 -->
    <div id="ach-notification" class="notification">
        <div class="notif-title tech-font">ACHIEVEMENT UNLOCKED</div>
        <div id="notif-message" class="notif-msg">実績を解除しました</div>
    </div>

    <!-- メインのゲームロジックとMQTT制御 -->
    <script>
        // ==========================================
        // 🌐 MQTT MULTIPLAYER CONFIGURATION
        // ==========================================
        // 登録・キー不要のフリーパブリックWebsocket MQTTブローカーを使用します。
        const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
        const MQTT_TOPIC = 'cosmic_clicker_p2p_v3/lobby';

        let client = null;
        let isOnline = false;
        let activePlayers = {}; // 他のアクティブなオンラインプレイヤーを保持するオブジェクト

        // アプリケーションごとに一意の端末IDを生成（シークレットモードでは別IDが発行される）
        let userId = getOrCreateUserId();
        let username = getOrCreateUsername();

        // ==========================================
        // GAME STATE & CONFIG
        // ==========================================
        let crystals = 0;
        let totalCrystals = 0;
        let totalClicks = 0;
        let clickedMeteors = 0;
        let baseClickValue = 1;
        let clickValueUpgrades = 0;
        let globalCpsMultiplier = 1;

        let buffTimer = 0;
        let buffMultiplier = 1;
        let lastUpdateTime = Date.now();
        let lastSyncTime = 0;

        const COOP_GOAL = 1000000;
        let currentCoopClicks = 0;

        // 施設
        let buildings = [
            { id: 'miner', name: '自動採掘クローン', cost: 15, baseCost: 15, cps: 0.1, count: 0, multiplier: 1, desc: 'クローンが代わりに手掘りで作業します。' },
            { id: 'drill', name: '採掘ドリル', cost: 100, baseCost: 100, cps: 1, count: 0, multiplier: 1, desc: '回転ドリルで結晶を自動破壊します。' },
            { id: 'laser', name: 'プラズマレーザー', cost: 1100, baseCost: 1100, cps: 8, count: 0, multiplier: 1, desc: '超高熱レーザーで遠隔切削します。' },
            { id: 'reactor', name: '熱融合炉', cost: 12000, baseCost: 12000, cps: 47, count: 0, multiplier: 1, desc: '熱源エネルギーを利用し大規模採掘。' },
            { id: 'gravity', name: '重力濃縮器', cost: 130000, baseCost: 130000, cps: 260, count: 0, multiplier: 1, desc: '重力場を用いて結晶を引き寄せます。' },
            { id: 'warp', name: '次元ワープ採掘機', cost: 1400000, baseCost: 1400000, cps: 1400, count: 0, multiplier: 1, desc: '平行世界から直接資源を転送します。' },
            { id: 'timemachine', name: 'タイムマシン', cost: 20000000, baseCost: 20000000, cps: 7800, count: 0, multiplier: 1, desc: '未来で発掘されたクリスタルを持ってきます。' }
        ];

        // 強化
        let upgrades = [
            { id: 'up_click_1', name: '強化グローブ', cost: 100, purchased: false, type: 'click_add', value: 1, desc: 'クリックパワーが恒久的に +1' },

        // ==========================================
        // 🤖 疑似オンライン用（オフライン時のみ稼働）
        // ==========================================
        const mockNames = ["StarMiner_99", "GalaxyX", "Asteroid_Destroyer", "DeepSpaceWorker", "QuantumCat", "NovaGlow"];
        let mockPlayers = mockNames.map((name, index) => ({
            userId: "mock_" + index,
            username: name,
            crystals: 500 + index * 400,
            cps: 1.5 + index * 5,
            totalClicks: 20 + index * 10,
            totalCrystals: 1000 + index * 1000,
            lastActive: Date.now()
        }));

        // ==========================================
        // CORE LIFECYCLE & LOOPS
        // ==========================================
        window.onload = function() {
            document.getElementById('username-input').value = username;
            loadGame();
            renderBuildings();
            renderUpgrades();
            renderAchievements();
            setupEventListeners();
            scheduleMeteor();

            // オンライン（MQTT）への接続を試行
            connectToMultiplayer();

            // 15秒ごとのローカル自動セーブ
            setInterval(() => saveGame(false), 15000);

            requestAnimationFrame(gameLoop);
        };

        function setupEventListeners() {
            const crystalBtn = document.getElementById('crystal-btn');
            crystalBtn.addEventListener('click', (e) => {
                const power = getClickPower();
                crystals += power;
                totalCrystals += power;
                totalClicks++;

                showPopup(`+${formatNumber(power)}`, e.clientX, e.clientY);
                updateUI();
            });
        }

        function gameLoop() {
            const now = Date.now();
            const dt = (now - lastUpdateTime) / 1000;
            lastUpdateTime = now;

            // バフタイマー
            if (buffTimer > 0) {
                buffTimer -= dt;
                if (buffTimer <= 0) {
                    buffTimer = 0;
                    buffMultiplier = 1;
                    document.getElementById('crystal-btn').classList.remove('frenzy-active');
                    document.getElementById('buff-timer').classList.remove('active');
                } else {
                    document.getElementById('buff-timer').textContent = `FRENZY 3倍中! (${buffTimer.toFixed(1)}s)`;
                }
            }

            // 自動生産
            const currentCps = getCps();
            crystals += currentCps * dt;
            totalCrystals += currentCps * dt;

            checkAchievements();
            updateUI();

            // 3秒に1回、他のプレイヤーに自分の最新データを配信
            if (now - lastSyncTime > 3000) {
                publishSyncData();
                cleanInactivePlayers(); // 接続が途絶えた古いプレイヤーを除去
                lastSyncTime = now;
            }

            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // 🌐 MQTT MULTIPLAYER NETWORK LOGIC
        // ==========================================
        function connectToMultiplayer() {
            const statusBadge = document.getElementById('connection-status');
            
            try {
                // MQTT over WebSocket で接続
                client = mqtt.connect(MQTT_BROKER, {
                    connectTimeout: 4000,
                    reconnectPeriod: 5000
                });

                client.on('connect', () => {
                    isOnline = true;
                    statusBadge.className = 'status-badge online';
                    statusBadge.textContent = 'ONLINE';
                    
                    // 擬似AIの動作をリセット・停止してクリーンな本物だけの部屋にする
                    if (mockInterval) clearInterval(mockInterval);
                    activePlayers = {}; 

                    client.subscribe(MQTT_TOPIC, (err) => {
                        if (!err) {
                            postActivityLog("宇宙空間にワープ接続しました");
                            publishSyncData();
                        }
                    });
                });

                client.on('message', (topic, message) => {
                    if (topic !== MQTT_TOPIC) return;
                    try {
                        const payload = JSON.parse(message.toString());
                        if (payload.userId === userId) return; // 自分の発言はスルー

                        if (payload.type === 'sync') {
                            // 受信したプレイヤーデータを登録
                            activePlayers[payload.userId] = {
                                username: payload.username,
                                crystals: payload.crystals,
                                cps: payload.cps,
                                totalClicks: payload.totalClicks,
                                lastActive: Date.now()
                            };
                            updateMultiplayStats();
                        } else if (payload.type === 'event') {
                            addLogToUI(payload.username, payload.text);
                        }
                    } catch (e) {
                        console.error("ネットワークメッセージの解析に失敗しました", e);
                    }
                });

                client.on('close', () => {
                    if (isOnline) {
                        isOnline = false;
                        initMockConnection(); // 切断時は瞬時にAI疑似モードへ移行
                    }
                });

                client.on('error', (err) => {
                    console.warn("ネットワーク接続エラー、疑似オンラインに切り替えます。", err);
                    if (!isOnline) initMockConnection();
                });

                // 4秒間接続できない場合、自動的にローカル疑似モードへ切り替え
                setTimeout(() => {
                    if (!isOnline) {
                        console.log("接続タイムアウト。疑似オンラインへフォールバックします。");
                        initMockConnection();
                    }
                }, 4000);

            } catch (e) {
                console.warn("MQTTセットアップ失敗、疑似モードに切り替えます。", e);
                initMockConnection();
            }
        }

        // 3秒ごとのデータ送信
        function publishSyncData() {
            if (!isOnline || !client || !client.connected) return;

            const syncMsg = {
                type: 'sync',
                userId: userId,
                username: username,
                crystals: Math.floor(crystals),
                cps: getCps(),
                totalClicks: totalClicks
            };

            client.publish(MQTT_TOPIC, JSON.stringify(syncMsg));
        }

        // 銀河フィードへの活動イベント送信
        function postActivityLog(text) {
            if (isOnline && client && client.connected) {
                const eventMsg = {
                    type: 'event',
                    userId: userId,
                    username: username,
                    text: text
                };
                client.publish(MQTT_TOPIC, JSON.stringify(eventMsg));
            }
            addLogToUI(username, text);
        }

        // 一定時間（6秒以上）発言のないプレイヤーをオフライン化
        function cleanInactivePlayers() {
            const now = Date.now();
            let changed = false;
            Object.keys(activePlayers).forEach(id => {
                // AIプレイヤーはオフライン判定から除外
                if (id.startsWith('mock_')) return;

                if (now - activePlayers[id].lastActive > 6000) {
                    delete activePlayers[id];
                    changed = true;
                }
            });
            if (changed) {
                updateMultiplayStats();
            }
        }

        // ==========================================
        // 🤖 疑似オンライン（AI制御）
        // ==========================================
        function initMockConnection() {
            if (mockInterval) return; // 既に開始していれば処理しない
            
            const statusBadge = document.getElementById('connection-status');
            statusBadge.className = 'status-badge offline';
            statusBadge.textContent = 'PSEUDO-ONLINE (LOCAL AI)';

            // 3秒ごとに擬似AIプレイヤーの状態を変化
            mockInterval = setInterval(() => {
                mockPlayers.forEach(p => {
                    p.crystals += p.cps * 3;
                    p.totalCrystals += p.cps * 3;
                    p.totalClicks += Math.floor(p.cps * 0.1) + 1;

                    // 8%の確率でAIが新しい施設を購入
                    if (Math.random() < 0.08) {
                        const randomB = buildings[Math.floor(Math.random() * 4)];
                        p.cps += randomB.cps;
                        p.crystals = Math.max(0, p.crystals - randomB.cost * 0.5);
                        addLogToUI(p.username, `${randomB.name} を購入しました！`);
                    }
                    // 4%の確率でAIが隕石回収
                    if (Math.random() < 0.04) {
                        p.crystals += p.cps * 100;
                        addLogToUI(p.username, `隕石を回収しました！`);
                    }

                    // 疑似的にマップに登録
                    activePlayers[p.userId] = {
                        username: p.username,
                        crystals: p.crystals,
                        cps: p.cps,
                        totalClicks: p.totalClicks,
                        lastActive: Date.now()
                    };
                });

                updateMultiplayStats();
            }, 3000);
        }

        // ==========================================
        // MULTIPLAY STATISTICS & UI REBUILD
        // ==========================================
        function updateMultiplayStats() {
            // 自分も含めた全員のプレイヤーリスト
            const playerList = Object.keys(activePlayers).map(id => activePlayers[id]);
            playerList.push({
                userId: userId,
                username: username,
                crystals: crystals,
                cps: getCps(),
                totalClicks: totalClicks
            });

            // オンラインプレイヤーの人数表示を更新
            const onlineCount = playerList.length;
            const statusBadge = document.getElementById('connection-status');
            if (isOnline) {
                statusBadge.textContent = `ONLINE (${onlineCount})`;
                statusBadge.className = 'status-badge online';
            } else {
                statusBadge.textContent = `PSEUDO-ONLINE (${onlineCount})`;
                statusBadge.className = 'status-badge offline';
            }

            // オンラインプレイヤー全員の手動クリック総数をマージ（協力イベント進行度）
            const totalCoopClicks = playerList.reduce((sum, p) => sum + (p.totalClicks || 0), 0);
            currentCoopClicks = totalCoopClicks;
            updateCoopUI();

            // ランキング順に並び替え
            playerList.sort((a, b) => b.crystals - a.crystals);
            updateRankingUI(playerList);
        }

        function updateRankingUI(list) {
            const container = document.getElementById('ranking-list');
            container.innerHTML = '';

            list.slice(0, 10).forEach((p, idx) => {
                const el = document.createElement('div');
                el.className = `ranking-item ${p.userId === userId ? 'self' : ''}`;
                
                const isTop = idx < 3;
                el.innerHTML = `
                    <div class="rank-number ${isTop ? 'top-rank' : ''} tech-font">#${idx + 1}</div>
                    <div class="rank-name">${p.username}</div>
                    <div class="rank-values">
                        <div class="rank-crystals tech-font">${formatNumber(p.crystals)}</div>
                        <div class="rank-cps tech-font">${formatNumber(p.cps)}/s</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function updateCoopUI() {
            const bar = document.getElementById('coop-bar');
            const percent = Math.min(100, (currentCoopClicks / COOP_GOAL) * 100);
            bar.style.width = `${percent}%`;

            document.getElementById('coop-stats').textContent = `銀河累計クリック: ${currentCoopClicks.toLocaleString()} / ${COOP_GOAL.toLocaleString()} (${percent.toFixed(2)}%)`;

            // 目標達成時のバフ適用
            if (currentCoopClicks >= COOP_GOAL) {
                globalCpsMultiplier = 1.5; // 全体の自動生産力1.5倍化
            }
        }

        function addLogToUI(user, text) {
            const container = document.getElementById('log-content');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<strong style="color: #00f2fe;">${user}</strong>: ${text}`;
            container.appendChild(item);

            // ログ幅制限
            while (container.childNodes.length > 5) {
                container.removeChild(container.firstChild);
            }

        // ==========================================
        // SYSTEM CONTROLS (GLOBAL SCOPE)
        // ==========================================
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));

            const targetBtn = document.querySelector(`.tab-button[onclick="switchTab('${tabId}')"]`);
            if (targetBtn) targetBtn.classList.add('active');

            const targetPane = document.getElementById(`tab-${tabId}`);
            if (targetPane) targetPane.classList.add('active');
        }

        window.buyBuilding = function(id) {
            const b = buildings.find(x => x.id === id);
            if (!b || crystals < b.cost) return;

            crystals -= b.cost;
            b.count++;
            b.cost = Math.floor(b.baseCost * Math.pow(1.15, b.count));

            renderBuildings();
            updateUI();
            
            if (b.cost > 1000) {
                postActivityLog(`${b.name} を購入しました！`);
            }
        }

        window.buyUpgrade = function(id) {
            const u = upgrades.find(x => x.id === id);
            if (!u || u.purchased || crystals < u.cost) return;

            crystals -= u.cost;
            u.purchased = true;

            if (u.type === 'click_add') {
                clickValueUpgrades += u.value;
            } else if (u.type === 'building_mult') {
                const target = buildings.find(b => b.id === u.targetId);
                if (target) target.multiplier *= u.value;
            } else if (u.type === 'global_mult') {
                globalCpsMultiplier *= u.value;
            }

            renderBuildings();
            renderUpgrades();
            updateUI();
            
            postActivityLog(`研究技術「${u.name}」を実用化しました！`);
        }

        window.changeUsername = function(newVal) {
            if (!newVal || newVal.trim() === '') return;
            const oldName = username;
            username = newVal.trim();
            localStorage.setItem('cosmic_clicker_username', username);
            postActivityLog(`${oldName} が名前を ${username} に変更しました`);
            publishSyncData();
        }

        window.saveGame = function(isManual = false) {
            const saveData = {
                crystals,
                totalCrystals,
                totalClicks,
                clickedMeteors,
                clickValueUpgrades,
                globalCpsMultiplier,
                buildings: buildings.map(b => ({ id: b.id, count: b.count, cost: b.cost, multiplier: b.multiplier })),
                upgrades: upgrades.map(u => ({ id: u.id, purchased: u.purchased })),
                achievements: achievements.map(a => ({ id: a.id, unlocked: a.unlocked }))
            };

            localStorage.setItem('cosmic_clicker_save_v3', JSON.stringify(saveData));
            if (isManual) alert('進行状況を保存しました！');
        }

        window.resetGame = function() {
            if (confirm('ローカルの全セーブデータを削除し再起動しますか？')) {
                localStorage.removeItem('cosmic_clicker_save_v3');
                localStorage.removeItem('cosmic_clicker_username');
                localStorage.removeItem('cosmic_clicker_uid');
                location.reload();
            }
        }

        // ==========================================
        // GAMEPLAY FUNCTIONS
        // ==========================================
        function getCps() {
            let total = 0;
            buildings.forEach(b => {
                total += b.count * b.cps * b.multiplier;
            });
            return total * globalCpsMultiplier * buffMultiplier;
        }

        function getClickPower() {
            return (baseClickValue + clickValueUpgrades) * (buffMultiplier === 3 ? 3 : 1);
        }

        function getBuildingCount(id) {
            const b = buildings.find(x => x.id === id);
            return b ? b.count : 0;
        }

        function getTotalBuildings() {
            return buildings.reduce((sum, b) => sum + b.count, 0);
        }

        function updateUI() {
            document.getElementById('crystals-display').textContent = formatNumber(crystals);
            document.getElementById('cps-display').textContent = `毎秒: ${formatNumber(getCps())} クリスタル`;
            
            document.getElementById('stat-total-crystals').textContent = formatNumber(totalCrystals);
            document.getElementById('stat-total-clicks').textContent = totalClicks.toLocaleString();
            document.getElementById('stat-click-power').textContent = formatNumber(getClickPower());
            document.getElementById('stat-meteors').textContent = clickedMeteors;

            updateButtonStates();
        }

        function updateButtonStates() {
            buildings.forEach(b => {
                const btn = document.getElementById(`btn-${b.id}`);
                if (btn) {
                    if (crystals >= b.cost) btn.classList.remove('disabled');
                    else btn.classList.add('disabled');
                }
            });

            upgrades.forEach(u => {
                const btn = document.getElementById(`btn-${u.id}`);
                if (btn) {
                    if (crystals >= u.cost) btn.classList.remove('disabled');
                    else btn.classList.add('disabled');
                }
            });
        }

        function showPopup(text, x, y, customColor = '') {
            const popup = document.createElement('div');
            popup.className = 'click-popup tech-font';
            popup.textContent = text;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            if (customColor) {
                popup.style.color = customColor;
                popup.style.textShadow = `0 0 6px ${customColor}`;
            }
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
        }

        function renderBuildings() {
            const container = document.getElementById('buildings-list');
            container.innerHTML = '';
            buildings.forEach(b => {
                const el = document.createElement('div');
                el.id = `btn-${b.id}`;
                el.className = 'building-item disabled';
                el.onclick = () => window.buyBuilding(b.id);
                el.innerHTML = `
                    <div class="building-info">
                        <div class="building-name">${b.name}</div>
                        <div class="building-desc">${b.desc}</div>
                        <div class="building-stats">効率: +${formatNumber(b.cps * b.multiplier)}/s</div>
                    </div>
                    <div class="building-cost-box">
                        <div class="building-cost tech-font">${formatNumber(b.cost)}</div>
                        <div class="building-count tech-font">${b.count}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function renderUpgrades() {
            const container = document.getElementById('upgrades-list');
            container.innerHTML = '';
            let hasAvailable = false;
            upgrades.forEach(u => {
                if (u.purchased) return;
                hasAvailable = true;
                const el = document.createElement('div');
                el.id = `btn-${u.id}`;
                el.className = 'upgrade-item disabled';
                el.onclick = () => window.buyUpgrade(u.id);
                el.innerHTML = `
                    <div class="upgrade-info">
                        <div class="upgrade-name">${u.name}</div>
                        <div class="upgrade-desc">${u.desc}</div>
                    </div>
                    <div class="upgrade-cost tech-font">${formatNumber(u.cost)}</div>
                `;
                container.appendChild(el);
            });
            if (!hasAvailable) {
                container.innerHTML = '<div style="color:#64748b; font-size:12px; text-align:center; padding:20px;">適用可能な研究技術はありません</div>';
            }
        }

        function renderAchievements() {
            const container = document.getElementById('achievements-list');
            container.innerHTML = '';
            achievements.forEach(ach => {
                const el = document.createElement('div');
                el.className = `achievement-item ${ach.unlocked ? 'unlocked' : ''}`;
                el.innerHTML = `
                    <div class="achievement-badge">⚡</div>
                    <div class="achievement-details">
                        <div class="achievement-title">${ach.name}</div>
                        <div class="achievement-desc">${ach.desc}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function checkAchievements() {
            achievements.forEach(ach => {
                if (!ach.unlocked && ach.check()) {
                    ach.unlocked = true;
                    showAchievementNotification(ach.name, ach.desc);
                    renderAchievements();
                }
            });
        }

        function showAchievementNotification(title, desc) {
            const notif = document.getElementById('ach-notification');
            document.getElementById('notif-message').textContent = `${title} (${desc})`;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 4000);
        }

        function spawnMeteor() {
            if (document.querySelector('.meteor')) return;
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            const x = Math.random() * (window.innerWidth - 100) + 50;
            const y = Math.random() * (window.innerHeight - 200) + 70;
            meteor.style.left = `${x}px`;
            meteor.style.top = `${y}px`;

            meteor.addEventListener('click', (e) => {
                e.stopPropagation();
                clickedMeteors++;
                meteor.remove();

                if (Math.random() < 0.5) {
                    const bonus = Math.max(50, getCps() * 180);
                    crystals += bonus;
                    totalCrystals += bonus;
                    showPopup(`隕石回収! +${formatNumber(bonus)}`, e.clientX, e.clientY, '#ff007f');
                    postActivityLog(`宇宙をさまよう超純度隕石を回収しました！`);
                } else {
                    buffTimer = 15;
                    buffMultiplier = 3;
                    document.getElementById('crystal-btn').classList.add('frenzy-active');
                    document.getElementById('buff-timer').classList.add('active');
                    showPopup(`FRENZY (3倍)!`, e.clientX, e.clientY, '#ff007f');
                    postActivityLog(`時空のワームホールをこじ開けてFRENZYを展開！`);
                }
                updateUI();
            });

            document.body.appendChild(meteor);
            setTimeout(() => { if (meteor.parentNode) meteor.remove(); }, 10000);
        }

        function scheduleMeteor() {
            const nextTime = (Math.random() * 30 + 30) * 1000;
            setTimeout(() => { spawnMeteor(); scheduleMeteor(); }, nextTime);
        }

        // ==========================================
        // LOCAL STORAGE & DATA CONTROLLERS
        // ==========================================
        function getOrCreateUserId() {
            // Cookieと同じ役割を果たすlocalStorageを使用（シークレットモードでは別空間になります）
            let uid = localStorage.getItem('cosmic_clicker_uid');
            if (!uid) {
                uid = 'u_' + Math.random().toString(36).substring(2, 11);
                localStorage.setItem('cosmic_clicker_uid', uid);
            }
            return uid;
        }

        function getOrCreateUsername() {
            let name = localStorage.getItem('cosmic_clicker_username');
            if (!name) {
                name = 'Miner_' + Math.floor(Math.random() * 9000 + 1000);
                localStorage.setItem('cosmic_clicker_username', name);
            }
            return name;
        }

        function loadGame() {
            const savedStr = localStorage.getItem('cosmic_clicker_save_v3');
            if (!savedStr) return;
            try {
                const data = JSON.parse(savedStr);
                if (data.crystals !== undefined) crystals = data.crystals;
                if (data.totalCrystals !== undefined) totalCrystals = data.totalCrystals;
                if (data.totalClicks !== undefined) totalClicks = data.totalClicks;
                if (data.clickedMeteors !== undefined) clickedMeteors = data.clickedMeteors;
                if (data.clickValueUpgrades !== undefined) clickValueUpgrades = data.clickValueUpgrades;
                if (data.globalCpsMultiplier !== undefined) globalCpsMultiplier = data.globalCpsMultiplier;

                if (data.buildings) {
                    data.buildings.forEach(sb => {
                        const b = buildings.find(x => x.id === sb.id);
                        if (b) {
                            b.count = sb.count || 0;
                            b.cost = sb.cost || b.baseCost;
                            b.multiplier = sb.multiplier || 1;
                        }
                    });
                }
                if (data.upgrades) {
                    data.upgrades.forEach(su => {
                        const u = upgrades.find(x => x.id === su.id);
                        if (u) u.purchased = su.purchased || false;
                    });
                }
                if (data.achievements) {
                    data.achievements.forEach(sa => {
                        const a = achievements.find(x => x.id === sa.id);
                        if (a) a.unlocked = sa.unlocked || false;
                    });
                }
            } catch (e) {
                console.error("ローカルデータの復元中にエラーが発生しました", e);
            }
        }

        function formatNumber(num, decimals = 1) {
            if (num < 1000) return num % 1 === 0 ? num.toString() : num.toFixed(decimals);
            const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi"];
            const i = Math.min(Math.floor(Math.log10(num) / 3), suffixes.length - 1);
            return (num / Math.pow(10, i * 3)).toFixed(2) + suffixes[i];
        }
    </script>
</body>

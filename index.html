<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC CLICKER - サーバーサイド監視版</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #05050a; color: #e2e8f0; height: 100vh; display: flex; overflow: hidden; }
        .tech-font { font-family: 'Orbitron', sans-serif; }
        .left-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background: radial-gradient(circle, #0f111a 0%, #05050a 100%); border-right: 1px solid rgba(255, 255, 255, 0.05); padding: 20px; }
        .right-panel { width: 480px; display: flex; flex-direction: column; background: #090a10; border-left: 1px solid rgba(255, 255, 255, 0.05); }
        .game-title { font-size: 24px; letter-spacing: 4px; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); margin-bottom: 10px; font-weight: 900; }
        .coop-container { width: 80%; max-width: 400px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 10px; margin-bottom: 15px; text-align: center; }
        .coop-title { font-size: 11px; color: #c084fc; margin-bottom: 6px; letter-spacing: 1px; }
        .coop-bar-bg { width: 100%; height: 8px; background: #11131e; border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
        .coop-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #c084fc, #00f2fe); box-shadow: 0 0 8px #c084fc; transition: width 0.5s ease; }
        .coop-stats { font-size: 10px; color: #64748b; }
        .stats-container { text-align: center; margin-bottom: 20px; }
        .crystal-count { font-size: 40px; font-weight: 700; color: #ffffff; text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); margin-bottom: 4px; }
        .cps-count { font-size: 15px; color: #94a3b8; }
        .crystal-wrapper { position: relative; margin-bottom: 20px; }
        .crystal { width: 150px; height: 200px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 40%, #c084fc 100%); clip-path: polygon(50% 0%, 85% 25%, 85% 75%, 50% 100%, 15% 75%, 15% 25%); box-shadow: 0 0 35px rgba(0, 242, 254, 0.4); cursor: pointer; transition: transform 0.05s ease, filter 0.1s ease; position: relative; }
        .crystal::before { content: ''; position: absolute; top: 2%; left: 2%; right: 2%; bottom: 2%; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 55%, rgba(0,0,0,0.4) 100%); clip-path: polygon(50% 0%, 85% 25%, 85% 75%, 50% 100%, 15% 75%, 15% 25%); }
        .crystal:hover { filter: brightness(1.2) drop-shadow(0 0 20px rgba(0, 242, 254, 0.8)); transform: scale(1.03); }
        .crystal:active { transform: scale(0.96); }
        .log-panel { position: absolute; bottom: 20px; left: 20px; width: 320px; height: 180px; background: rgba(9, 10, 16, 0.85); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .log-title { color: #94a3b8; font-weight: bold; font-size: 11px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 4px; margin-bottom: 6px; }
        .log-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
        .log-item { font-size: 11px; word-break: break-all; line-height: 1.4; }
        .chat-input-area { display: flex; gap: 6px; }
        .chat-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; padding: 6px 10px; color: #fff; font-size: 11px; }
        .chat-input:focus { outline: none; border-color: #00f2fe; background: rgba(255, 255, 255, 0.08); }
        .chat-btn { background: rgba(0, 242, 254, 0.15); border: 1px solid rgba(0, 242, 254, 0.3); color: #00f2fe; border-radius: 4px; padding: 0 12px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .tab-headers { display: flex; background: #11131e; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .tab-button { flex: 1; padding: 15px 0; background: none; border: none; color: #94a3b8; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; }
        .tab-button.active { color: #00f2fe; border-bottom: 2px solid #00f2fe; background: rgba(0, 242, 254, 0.02); }
        .tab-contents { flex: 1; overflow-y: auto; padding: 20px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .building-item, .upgrade-item { display: flex; align-items: center; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; margin-bottom: 12px; cursor: pointer; }
        .building-item.disabled, .upgrade-item.disabled { opacity: 0.5; cursor: not-allowed; }
        .building-info, .upgrade-info { flex: 1; }
        .building-name, .upgrade-name { font-weight: bold; font-size: 14px; margin-bottom: 2px; }
        .upgrade-name { color: #c084fc; }
        .building-desc, .upgrade-desc { font-size: 11px; color: #64748b; }
        .building-cost-box, .upgrade-cost { text-align: right; padding-left: 10px; }
        .building-cost, .upgrade-cost { font-size: 14px; font-weight: bold; color: #00f2fe; }
        .upgrade-cost { color: #c084fc; }
        .building-count { font-size: 18px; font-weight: bold; color: rgba(255, 255, 255, 0.25); }
        .ranking-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 10px; }
        .status-badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .status-badge.online { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-badge.offline { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .ranking-list { display: flex; flex-direction: column; gap: 8px; }
        .ranking-item { display: flex; align-items: center; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 6px; padding: 10px 15px; }
        .ranking-item.self { border-color: rgba(0, 242, 254, 0.4); background: rgba(0, 242, 254, 0.03); }
        .rank-number { width: 25px; font-weight: bold; font-size: 15px; color: #64748b; }
        .rank-number.top-rank { color: #00f2fe; }
        .rank-name { flex: 1; font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-values { text-align: right; }
        .rank-crystals { font-size: 13px; font-weight: bold; }
        .rank-cps { font-size: 10px; color: #64748b; }
        .achievement-item { display: flex; align-items: center; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; margin-bottom: 10px; opacity: 0.35; }
        .achievement-item.unlocked { opacity: 1; background: rgba(0, 242, 254, 0.03); border-color: rgba(0, 242, 254, 0.3); }
        .achievement-badge { width: 32px; height: 32px; background: #1e293b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; }
        .achievement-item.unlocked .achievement-badge { background: #00f2fe; color: #05050a; }
        .stats-list { background: rgba(255, 255, 255, 0.02); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .stats-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 13px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .text-input { width: 100%; padding: 10px; background: #11131e; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 13px; }
        .btn-action { display: block; width: 100%; padding: 12px; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #f43f5e; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; margin-bottom: 10px; }
        .btn-save { background: rgba(0, 242, 254, 0.15); border: 1px solid rgba(0, 242, 254, 0.3); color: #00f2fe; }
        .click-popup { position: absolute; color: #00f2fe; font-weight: 900; font-size: 20px; pointer-events: none; animation: popup-anim 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; text-shadow: 0 0 6px rgba(0, 242, 254, 0.8); z-index: 10; }
        @keyframes popup-anim { 0% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) translateY(-100px) scale(0.8); opacity: 0; } }
        .notification { position: fixed; bottom: 20px; right: 20px; background: rgba(9, 10, 16, 0.95); border: 1px solid #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.3); border-radius: 8px; padding: 12px 20px; color: #fff; z-index: 1000; transform: translateY(100px); opacity: 0; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s; pointer-events: none; width: 300px; }
        .notification.show { transform: translateY(0); opacity: 1; }
        .notif-title { color: #ff007f; font-weight: bold; font-size: 13px; margin-bottom: 2px; }
        .notif-msg { font-size: 11px; color: #94a3b8; }
        @media (max-width: 900px) { body { flex-direction: column; overflow-y: auto; height: auto; } .left-panel { height: 55vh; position: sticky; top: 0; z-index: 10; } .right-panel { width: 100%; } }
    </style>
</head>
<body>

    <!-- 左パネル -->
    <div class="left-panel">
        <h1 class="game-title tech-font">COSMIC CLICKER</h1>
        
        <div class="coop-container">
            <div class="coop-title tech-font">GALACTIC MISSION: COOP CLICK EVENT</div>
            <div class="coop-bar-bg">
                <div id="coop-bar" class="coop-bar-fill"></div>
            </div>
            <div id="coop-stats" class="coop-stats tech-font">銀河累計クリック: 0 / 1,000,000 (0.00%)</div>
        </div>

        <div class="stats-container">
            <div id="crystals-display" class="crystal-count tech-font">0</div>
            <div id="cps-display" class="cps-count">毎秒: 0 クリスタル</div>
        </div>

        <div class="crystal-wrapper">
            <div id="crystal-btn" class="crystal"></div>
        </div>

        <!-- チャット ＆ ログ -->
        <div class="log-panel">
            <div class="log-title tech-font">GALACTIC FEED & CHAT</div>
            <div id="log-content" class="log-content"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力..." maxlength="50" onkeydown="handleChatKey(event)">
                <button class="chat-btn" onclick="sendChat()">送信</button>
            </div>
        </div>
    </div>

    <!-- 右パネル -->
    <div class="right-panel">
        <div class="tab-headers">
            <button class="tab-button active" onclick="switchTab('buildings')">施設</button>
            <button class="tab-button" onclick="switchTab('upgrades')">強化</button>
            <button class="tab-button" onclick="switchTab('ranking')">ランキング</button>
            <button class="tab-button" onclick="switchTab('achievements')">実績</button>
            <button class="tab-button" onclick="switchTab('settings')">管理</button>
        </div>

        <div class="tab-contents">
            <div id="tab-buildings" class="tab-pane active"><div id="buildings-list"></div></div>
            <div id="tab-upgrades" class="tab-pane"><div id="upgrades-list"></div></div>
            <div id="tab-ranking" class="tab-pane">
                <div class="ranking-header">
                    <h3 style="font-size: 15px;">銀河採掘ランキング</h3>
                    <span id="connection-status" class="status-badge offline">CONNECTING...</span>
                </div>
                <div id="ranking-list" class="ranking-list"></div>
            </div>
            <div id="tab-achievements" class="tab-pane"><div id="achievements-list"></div></div>
            <div id="tab-settings" class="tab-pane">
                <div class="input-group">
                    <label for="username-input">あなたのニックネーム</label>
                    <input type="text" id="username-input" class="text-input" maxlength="15" onchange="changeUsername(this.value)">
                </div>
                <h3 style="margin-bottom: 10px; font-size: 14px;">サーバー同期統計</h3>
                <div class="stats-list">
                    <div class="stats-row"><span class="stats-label">サーバー上クリスタル</span><span id="stat-total-crystals" class="tech-font">0</span></div>
                    <div class="stats-row"><span class="stats-label">総クリック数</span><span id="stat-total-clicks" class="tech-font">0</span></div>
                    <div class="stats-row"><span class="stats-label">クリック生産量</span><span id="stat-click-power" class="tech-font">1</span></div>
                </div>
                <button class="btn-action" onclick="resetGame()">データをリセット</button>
            </div>
        </div>
    </div>

    <div id="ach-notification" class="notification">
        <div class="notif-title tech-font">ACHIEVEMENT UNLOCKED</div>
        <div id="notif-message" class="notif-msg">実績を解除しました</div>
    </div>

    <script>
        // ==========================================
        // 🛠️ CLOUDFLARE WORKER DEPLOYED URL
        // ==========================================
        const API_BASE_URL = 'https://cosmic-server.aixai-d-a-y-o-n.workers.dev'; 

        let userId = localStorage.getItem('cosmic_worker_uid') || null;
        let username = localStorage.getItem('cosmic_worker_username') || "Miner_" + Math.floor(Math.random() * 9000 + 1000);
        
        let clientCrystals = 0; 
        let serverCrystals = 0; 
        let serverCps = 0;
        let serverClickPower = 1;
        let localClicksQueue = 0; 
        
        let lastUpdateTime = Date.now();
        let lastSyncTime = Date.now();
        let isOnline = false;

        let buildings = [
            { id: 'miner', name: '自動採掘クローン', cost: 15, baseCost: 15, cps: 0.1, count: 0, desc: 'クローンが代わりに手掘りで作業します。' },
            { id: 'drill', name: '採掘ドリル', cost: 100, baseCost: 100, cps: 1, count: 0, desc: '回転ドリルで結晶を自動破壊します。' },
            { id: 'laser', name: 'プラズマレーザー', cost: 1100, baseCost: 1100, cps: 8, count: 0, desc: '超高熱レーザーで遠隔切削します。' },
            { id: 'reactor', name: '熱融合炉', cost: 12000, baseCost: 12000, cps: 47, count: 0, desc: '熱源エネルギーを利用し大規模採掘。' },
            { id: 'gravity', name: '重力濃縮器', cost: 130000, baseCost: 130000, cps: 260, count: 0, desc: '重力場を用いて結晶を引き寄せます。' },
            { id: 'warp', name: '次元ワープ採掘機', cost: 1400000, baseCost: 1400000, cps: 1400, count: 0, desc: '平行世界から直接資源を転送します。' },
            { id: 'timemachine', name: 'タイムマシン', cost: 20000000, baseCost: 20000000, cps: 7800, count: 0, desc: '未来で発掘されたクリスタルを持ってきます。' }
        ];

        let upgrades = [
            { id: 'up_click_1', name: '強化グローブ', cost: 100, purchased: false, desc: 'クリックパワーが恒久的に +1' },
            { id: 'up_click_2', name: '精密ピッケル', cost: 500, purchased: false, desc: 'クリックパワーが恒久的に +5' },
            { id: 'up_click_3', name: 'ナノレーザー', cost: 10000, purchased: false, desc: 'クリックパワーが恒久的に +50' },
            { id: 'up_click_4', name: '空間破砕振動子', cost: 100000, purchased: false, desc: 'クリックパワーが恒久的に +500' },
            { id: 'up_b_miner', name: '超精密モーター', cost: 400, purchased: false, desc: '「自動採掘クローン」の効率が 2倍 に上昇' },
            { id: 'up_b_drill', name: '超硬合金ブレード', cost: 2000, purchased: false, desc: '「採掘ドリル」の効率が 2倍 に上昇' },
            { id: 'up_b_laser', name: '収束レンズ群', cost: 22000, purchased: false, desc: '「プラズマレーザー」の効率が 2倍 に上昇' },
            { id: 'up_g_1', name: '宇宙線共鳴フィールド', cost: 50000, purchased: false, desc: '全体の秒間自動生産力(CPS)が 1.2倍 に上昇' },
            { id: 'up_g_2', name: 'シンギュラリティ機関', cost: 1500000, purchased: false, desc: '全体の秒間自動生産力(CPS)が 1.5倍 に上昇' }
        ];

        let achievements = [
            { id: 'ach_1', name: '駆け出し採掘者', desc: '手動クリックを10回行う。', unlocked: false, check: (p) => p.totalClicks >= 10 },
            { id: 'ach_2', name: '最初の労働者', desc: '自動採掘クローンを1個以上所有。', unlocked: false, check: (p) => (p.buildings.miner || 0) >= 1 },
            { id: 'ach_3', name: '中堅工場', desc: '施設を合計15個以上所有。', unlocked: false, check: (p) => Object.values(p.buildings).reduce((a,b)=>a+b,0) >= 15 },
            { id: 'ach_4', name: '宇宙長者', desc: '累計で 10,000 クリスタルを発掘。', unlocked: false, check: (p) => p.totalCrystals >= 10000 },
            { id: 'ach_6', name: '自動化の極み', desc: '秒間生産量(CPS)が 1,000 を突破。', unlocked: false, check: (p) => p.cps >= 1000 },
            { id: 'ach_7', name: 'コズミック・レジェンド', desc: '累計で 10,000,000 クリスタルを発掘。', unlocked: false, check: (p) => p.totalCrystals >= 10000000 }
        ];

        window.onload = async function() {
            document.getElementById('username-input').value = username;
            await initPlayer();

            setInterval(() => {
                if (document.hidden) {
                    const now = Date.now();
                    const dt = (now - lastUpdateTime) / 1000;
                    lastUpdateTime = now;
                    clientCrystals += serverCps * dt;
                }
            }, 1000);

            // 定期的な自動同期
            setInterval(async () => {
                await syncWithServer();
            }, 2000);

            requestAnimationFrame(gameLoop);
        };

        async function initPlayer() {
            if (API_BASE_URL === 'YOUR_CLOUDFLARE_WORKERS_URL') {
                document.getElementById('connection-status').textContent = "Workers URL未設定";
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/init`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await response.json();
                
                userId = data.userId;
                localStorage.setItem('cosmic_worker_uid', userId);
                localStorage.setItem('cosmic_worker_username', data.username);
                
                applyServerState(data);
                isOnline = true;
                document.getElementById('connection-status').textContent = "ONLINE";
                document.getElementById('connection-status').className = "status-badge online";
            } catch (e) {
                console.error("サーバーへの接続に失敗しました。", e);
                document.getElementById('connection-status').textContent = "サーバー接続失敗";
            }
        }

        // ここをアップデート：同期の返答に含まれる feed (チャット) もリアルタイム描画する
        async function syncWithServer() {
            if (!isOnline) return;
            try {
                const sendClicks = localClicksQueue;
                localClicksQueue = 0; 

                const response = await fetch(`${API_BASE_URL}/api/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, clicks: sendClicks, username })
                });
                const data = await response.json();
                
                applyServerState(data.player);
                updateMultiplayUI(data.ranking);
                if (data.feed) renderFeed(data.feed); // 他人のチャットも自動で表示されるよう修正
            } catch (e) {
                console.error("同期失敗", e);
            }
        }

        function applyServerState(player) {
            serverCrystals = player.crystals;
            clientCrystals = player.crystals; 
            serverCps = player.cps;
            serverClickPower = player.clickPower;

            buildings.forEach(b => {
                b.count = player.buildings[b.id] || 0;
                b.cost = Math.floor(b.baseCost * Math.pow(1.15, b.count));
            });

            upgrades.forEach(u => {
                u.purchased = player.upgrades[u.id] || false;
            });

            renderBuildings();
            renderUpgrades();
            checkAchievements(player);
            
            document.getElementById('stat-total-crystals').textContent = formatNumber(player.totalCrystals);
            document.getElementById('stat-total-clicks').textContent = player.totalClicks.toLocaleString();
            document.getElementById('stat-click-power').textContent = formatNumber(player.clickPower);
        }

        function gameLoop() {
            const now = Date.now();
            const dt = (now - lastUpdateTime) / 1000;
            lastUpdateTime = now;

            if (!document.hidden) {
                clientCrystals += serverCps * dt;
                updateUI();
            }

            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('crystals-display').textContent = formatNumber(clientCrystals);
            document.getElementById('cps-display').textContent = `毎秒: ${formatNumber(serverCps)} クリスタル`;
            updateButtonStates();
        }

        window.buyBuilding = async function(id) {
            if (!isOnline) return;
            try {
                const response = await fetch(`${API_BASE_URL}/api/buy_building`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, buildingId: id })
                });
                const data = await response.json();
                applyServerState(data.player);
                updateMultiplayUI(data.ranking);
                if (data.feed) renderFeed(data.feed);
            } catch (e) {
                console.error("購入エラー", e);
            }
        }

        window.buyUpgrade = async function(id) {
            if (!isOnline) return;
            try {
                const response = await fetch(`${API_BASE_URL}/api/buy_upgrade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, upgradeId: id })
                });
                const data = await response.json();
                applyServerState(data.player);
                updateMultiplayUI(data.ranking);
                if (data.feed) renderFeed(data.feed);
            } catch (e) {
                console.error("アップグレードエラー", e);
            }
        }

        window.sendChat = async function() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text === '' || !isOnline) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, text })
                });
                const data = await response.json();
                renderFeed(data.feed);
                input.value = '';
            } catch (e) {
                console.error("チャット送信失敗", e);
            }
        }

        function updateMultiplayUI(rankingData) {
            const container = document.getElementById('ranking-list');
            container.innerHTML = '';
            rankingData.ranking.forEach((p, idx) => {
                const el = document.createElement('div');
                el.className = `ranking-item ${p.userId === userId ? 'self' : ''}`;
                el.innerHTML = `
                    <div class="rank-number ${idx < 3 ? 'top-rank' : ''} tech-font">#${idx + 1}</div>
                    <div class="rank-name">${p.username}</div>
                    <div class="rank-values">
                        <div class="rank-crystals tech-font">${formatNumber(p.crystals)}</div>
                        <div class="rank-cps tech-font">${formatNumber(p.cps)}/s</div>
                    </div>
                `;
                container.appendChild(el);
            });

            const bar = document.getElementById('coop-bar');
            const percent = Math.min(100, (rankingData.coopClicks / 1000000) * 100);
            bar.style.width = `${percent}%`;
            document.getElementById('coop-stats').textContent = `銀河累計クリック: ${rankingData.coopClicks.toLocaleString()} / 1,000,000 (${percent.toFixed(2)}%)`;
        }

        function renderFeed(feed) {
            const container = document.getElementById('log-content');
            // チャットをスクロール追従させるために、一度最新のものに上書き
            container.innerHTML = '';
            feed.forEach(item => {
                const el = document.createElement('div');
                el.className = 'log-item';
                if (item.isChat) {
                    el.innerHTML = `<strong style="color:#00f2fe;">${item.username}</strong>: <span style="color:#ffffff;">${item.text}</span>`;
                } else {
                    el.innerHTML = `<strong style="color:#c084fc;">[システム] ${item.username}</strong>: <span style="color:#94a3b8; font-style:italic;">${item.text}</span>`;
                }
                container.appendChild(el);
            });
            container.scrollTop = container.scrollHeight;
        }

        const crystalBtn = document.getElementById('crystal-btn');
        crystalBtn.addEventListener('click', (e) => {
            clientCrystals += serverClickPower;
            localClicksQueue++; 

            showPopup(`+${formatNumber(serverClickPower)}`, e.clientX, e.clientY);
            updateUI();
        });

        window.handleChatKey = function(e) {
            if (e.key === 'Enter') sendChat();
        };

        window.changeUsername = function(newVal) {
            if (!newVal || newVal.trim() === '') return;
            username = newVal.trim();
            localStorage.setItem('cosmic_worker_username', username);
            syncWithServer();
        };

        window.resetGame = function() {
            if (confirm('全てのデータをリセットしますか？')) {
                localStorage.clear();
                location.reload();
            }
        };

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            const targetBtn = document.querySelector(`.tab-button[onclick="switchTab('${tabId}')"]`);
            if (targetBtn) targetBtn.classList.add('active');
            const targetPane = document.getElementById(`tab-${tabId}`);
            if (targetPane) targetPane.classList.add('active');
        };

        function renderBuildings() {
            const container = document.getElementById('buildings-list');
            container.innerHTML = '';
            buildings.forEach(b => {
                const el = document.createElement('div');
                el.id = `btn-${b.id}`;
                el.className = 'building-item disabled';
                el.onclick = () => window.buyBuilding(b.id);
                el.innerHTML = `
                    <div class="building-info">
                        <div class="building-name">${b.name}</div>
                        <div class="building-desc">${b.desc}</div>
                        <div class="building-stats">効率: +${formatNumber(b.cps)}/s</div>
                    </div>
                    <div class="building-cost-box">
                        <div class="building-cost tech-font">${formatNumber(b.cost)}</div>
                        <div class="building-count tech-font">${b.count}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function renderUpgrades() {
            const container = document.getElementById('upgrades-list');
            container.innerHTML = '';
            let hasAvailable = false;
            upgrades.forEach(u => {
                if (u.purchased) return;
                hasAvailable = true;
                const el = document.createElement('div');
                el.id = `btn-${u.id}`;
                el.className = 'upgrade-item disabled';
                el.onclick = () => window.buyUpgrade(u.id);
                el.innerHTML = `
                    <div class="upgrade-info">
                        <div class="upgrade-name">${u.name}</div>
                        <div class="upgrade-desc">${u.desc}</div>
                    </div>
                    <div class="upgrade-cost tech-font">${formatNumber(u.cost)}</div>
                `;
                container.appendChild(el);
            });
            if (!hasAvailable) {
                container.innerHTML = '<div style="color:#64748b; font-size:12px; text-align:center; padding:20px;">適用可能な研究技術はありません</div>';
            }
        }

        function updateButtonStates() {
            buildings.forEach(b => {
                const btn = document.getElementById(`btn-${b.id}`);
                if (btn) {
                    if (clientCrystals >= b.cost) btn.classList.remove('disabled');
                    else btn.classList.add('disabled');
                }
            });
            upgrades.forEach(u => {
                const btn = document.getElementById(`btn-${u.id}`);
                if (btn) {
                    if (clientCrystals >= u.cost) btn.classList.remove('disabled');
                    else btn.classList.add('disabled');
                }
            });
        }

        function checkAchievements(player) {
            const container = document.getElementById('achievements-list');
            container.innerHTML = '';
            achievements.forEach(ach => {
                if (!ach.unlocked && ach.check(player)) {
                    ach.unlocked = true;
                    showAchievementNotification(ach.name, ach.desc);
                }
                const el = document.createElement('div');
                el.className = `achievement-item ${ach.unlocked ? 'unlocked' : ''}`;
                el.innerHTML = `
                    <div class="achievement-badge">⚡</div>
                    <div class="achievement-details">
                        <div class="achievement-title">${ach.name}</div>
                        <div class="achievement-desc">${ach.desc}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function showAchievementNotification(title, desc) {
            const notif = document.getElementById('ach-notification');
            document.getElementById('notif-message').textContent = `${title} (${desc})`;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 4000);
        }

        function showPopup(text, x, y) {
            const popup = document.createElement('div');
            popup.className = 'click-popup tech-font';
            popup.textContent = text;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
        }

        function formatNumber(num, decimals = 1) {
            if (num < 1000) return num % 1 === 0 ? num.toString() : num.toFixed(decimals);
            const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi"];
            const i = Math.min(Math.floor(Math.log10(num) / 3), suffixes.length - 1);
            return (num / Math.pow(10, i * 3)).toFixed(2) + suffixes[i];
        }
    </script>
</body>
</html>
